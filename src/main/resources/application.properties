spring.application.name=CampusFind
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusfind?serverTimezone=UTC&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
server.port=${PORT:8080}
campusfind.ai.api-key=${AI_API_KEY:}
campusfind.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
campusfind.ai.model=${AI_MODEL:gpt-5.4-mini}
campusfind.seed-data=${SEED_DATA:true}
campusfind.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
