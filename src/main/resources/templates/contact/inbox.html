<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inbox · CampusFind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/nav :: navbar}"></div><main class="container page-shell narrow-shell">
  <div class="page-heading"><span class="eyebrow">Private conversations</span><h1>Your inbox</h1><p>Talk with report posters without exposing your email address.</p></div>
  <div class="inbox-list" th:if="${!#lists.isEmpty(threads)}"><a class="inbox-row" th:each="thread : ${threads}" th:href="@{/inbox/{id}(id=${thread.id})}" th:with="other=${thread.owner.id == account.id ? thread.requester : thread.owner}"><span class="avatar-chip" th:text="${#strings.substring(other.displayName,0,1).toUpperCase()}">S</span><span class="inbox-main"><strong th:text="${other.displayName}">Poster</strong><span th:text="${thread.report.itemName}">Report item</span><small th:text="|About a ${thread.report.type.name().toLowerCase()} report · Updated ${#temporals.format(thread.updatedAt, 'MMM d, h:mm a')}|">Updated</small></span><span class="unread-badge" th:if="${unreadByThread[thread.id] > 0}" th:text="${unreadByThread[thread.id] + ' new'}">1 new</span><span class="inbox-arrow">→</span></a></div>
  <div class="empty-card" th:if="${#lists.isEmpty(threads)}"><div class="step-icon mint mx-auto mb-3">✉</div><h2>Your inbox is ready</h2><p>When you contact someone about a report, the conversation will appear here.</p><a class="btn btn-primary rounded-pill px-4" th:href="@{/reports}">Browse reports</a></div>
</main><footer class="site-footer"><div class="container">CampusFind · A safer way to reconnect.</div></footer></body></html>
