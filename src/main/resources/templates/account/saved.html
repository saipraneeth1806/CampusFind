<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Saved reports · CampusFind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/nav :: navbar}"></div><main class="container page-shell">
  <div class="page-heading"><span class="eyebrow">Keep a useful clue</span><h1>Saved reports</h1><p>Listings you bookmarked are collected here.</p></div>
  <div class="row g-3" th:if="${!#lists.isEmpty(savedReports)}"><div class="col-md-6 col-lg-4" th:each="saved : ${savedReports}"><a class="report-card" th:href="@{/reports/{id}(id=${saved.report.id})}"><span class="type-pill" th:classappend="${saved.report.type.name() == 'LOST' ? ' type-lost' : ' type-found'}" th:text="${saved.report.type.name() == 'LOST' ? 'Lost' : 'Found'}">Found</span><span class="card-arrow">♥</span><h3 th:text="${saved.report.itemName}">Item</h3><p class="card-meta"><span th:text="${saved.report.category.label}">Category</span><span>·</span><span th:text="${saved.report.location}">Location</span></p><small th:text="${saved.report.status.name()}">OPEN</small></a></div></div>
  <div class="empty-card" th:if="${#lists.isEmpty(savedReports)}"><div class="step-icon peach mx-auto mb-3">♡</div><h2>Nothing saved just yet</h2><p>Save a report you want to return to later.</p><a class="btn btn-primary rounded-pill px-4" th:href="@{/reports}">Browse reports</a></div>
</main><footer class="site-footer"><div class="container">CampusFind · A safer way to reconnect.</div></footer></body></html>
